name: Validate static site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/rules.js
          node --check src/course-catalog.js
      - name: Check required static files
        run: |
          test -f index.html
          test -f courses.html
          test -f styles.css
          test -f styles-catalog.css
          test -f styles-header.css
          test -f data/course-catalog/ee-course-mapping.json
