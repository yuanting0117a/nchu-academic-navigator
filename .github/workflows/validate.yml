name: Validate static site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/rules.js
          node --check src/course-catalog.js
          node --check src/course-map.js
          node --check src/course-import.js
          node --check src/ge-self-learning.js
          node scripts/validate-course-map.js
          node scripts/test-course-map-interactions.js
          node -e "JSON.parse(require('fs').readFileSync('data/course-map/ee-undergraduate-114.json','utf8'))"
      - name: Check required static files
        run: |
          test -f index.html
          test -f courses.html
          test -f styles.css
          test -f styles-catalog.css
          test -f styles-header.css
          test -f data/course-catalog/ee-course-mapping.json
          test -f styles-course-map.css
          test -f src/course-map.js
          test -f src/course-import.js
          test -f src/ge-self-learning.js
          test -f data/course-map/ee-undergraduate-114.json
          test -f scripts/validate-course-map.js
          test -f .github/workflows/deploy-pages.yml
